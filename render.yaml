services:
  - type: web
    name: moneyflow
    runtime: node
    plan: starter
    rootDir: moneyflow
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: moneyflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SECURE_COOKIES
        value: "1"
      - key: DB_FILE
        value: /var/data/moneyflow.db
      - key: ADMIN_SETUP_KEY
        sync: false
