<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%279%27 fill=%27%236d4aff%27/%3E%3Cpath d=%27M9 30V11l9 12V10l13 20%27 fill=%27none%27 stroke=%27white%27 stroke-width=%274%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
    <title>MoneyFlow</title>
    <style>
         :root {
            --bg: #f5f6fb;
            --card: #ffffff;
            --text: #151a33;
            --muted: #6b7190;
            --border: #e9ebf5;
            --primary: #6d4aff;
            --primary-soft: #efeaff;
            --green: #22c55e;
            --red: #ef4444;
            --amber: #f59e0b;
            --sidebar: #0f1230;
            --sidebar-text: #aeb3d6;
            --shadow: 0 4px 18px rgba(30, 30, 80, .06);
        }
        
        body.dark {
            --bg: #0b0d22;
            --card: #14173a;
            --text: #eef0ff;
            --muted: #9298c0;
            --border: #232750;
            --primary-soft: #261f5c;
            --shadow: none;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }
        
        svg.i {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        
        button {
            font: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        
        a {
            color: inherit;
        }
        
        input,
        select,
        textarea {
            font: inherit;
            color: var(--text);
        }
        /* ---------- layout ---------- */
        
        .layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 100vh;
        }
        
        aside {
            background: var(--sidebar);
            color: var(--sidebar-text);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
            padding: 0 8px;
        }
        
        .logo svg {
            width: 36px;
            height: 36px;
        }
        
        .tagline {
            padding: 4px 8px 14px;
            font-size: 13px;
            font-weight: 600;
            background: linear-gradient(90deg, #8b6bff, #4fc3ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            width: fit-content;
            margin-left: 8px;
        }
        
        nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 14px;
            border-radius: 12px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 4px;
            transition: .15s;
        }
        
        nav a:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }
        
        nav a.active {
            background: linear-gradient(90deg, #6d4aff, #8466ff);
            color: #fff;
            box-shadow: 0 6px 16px rgba(109, 74, 255, .4);
        }
        
        nav a .nb {
            margin-left: auto;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            border-radius: 99px;
            padding: 1px 7px;
        }
        
        @media (max-height: 900px) {
            .promo {
                width: 160px;
                align-self: center;
            }
        }
        
        .promo {
            margin-top: auto;
            flex-shrink: 0;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
        }
        
        .promo .wallet {
            position: relative;
            cursor: pointer;
            display: block;
            aspect-ratio: 3 / 4;
        }
        
        .promo .wallet img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .promo .wallet .ph {
            height: calc(100% - 16px);
            margin: 8px;
            border: 2px dashed rgba(255, 255, 255, .2);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--sidebar-text);
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }
        
        .promo .wallet .ph b {
            font-size: 34px;
            line-height: 1;
        }
        
        .promo .wallet:hover .ph {
            border-color: #8466ff;
            color: #fff;
        }
        
        .promo .wallet.has::after {
            content: 'Change image';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: 11px;
            text-align: center;
            padding: 6px 0;
            opacity: 0;
            transition: .15s;
        }
        
        .promo .wallet.has:hover::after {
            opacity: 1;
        }
        
        .promo .wallet:hover::after {
            opacity: 1;
        }
        
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #6d4aff, #4fc3ff);
            color: #fff;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow);
            border: 2px solid var(--card);
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .img-slot {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 800;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 2px dashed var(--border);
        }
        
        .img-slot.logo {
            border-radius: 18px;
            font-size: 34px;
        }
        
        .img-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .img-slot:hover {
            border-color: var(--primary);
        }
        
        .promo h4 {
            font-size: 16px;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        
        .promo p {
            font-size: 12px;
            color: var(--sidebar-text);
            margin-bottom: 14px;
            line-height: 1.5;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #6d4aff, #8466ff);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 6px 14px rgba(109, 74, 255, .3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-primary:hover {
            filter: brightness(1.08);
        }
        
        .btn-primary.block {
            width: 100%;
        }
        
        .btn {
            border: 1px solid var(--border);
            background: var(--card);
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .btn.danger {
            color: var(--red);
        }
        
        .btn.sm {
            padding: 6px 10px;
            font-size: 12.5px;
        }
        
        .theme {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 22px;
            padding: 0 8px;
            font-size: 13px;
        }
        
        .switch {
            width: 44px;
            height: 24px;
            border-radius: 99px;
            background: #6d4aff;
            position: relative;
            flex-shrink: 0;
        }
        
        .switch::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: .2s;
        }
        
        body.dark .switch::after {
            transform: translateX(20px);
        }
        
        main {
            padding: 28px 32px 40px;
            min-width: 0;
        }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 22px;
        }
        
        .topbar h1 {
            font-size: 28px;
            font-weight: 800;
        }
        
        .topbar p {
            color: var(--muted);
            margin-top: 6px;
        }
        
        .top-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
        }
        
        .pill {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            font-weight: 600;
        }
        
        .pill button {
            display: flex;
            padding: 2px;
            border-radius: 6px;
            color: var(--muted);
        }
        
        .pill button:hover {
            color: var(--primary);
            background: var(--primary-soft);
        }
        
        #monthLabel {
            cursor: pointer;
            white-space: nowrap;
        }
        
        .bell {
            position: relative;
            width: 44px;
            height: 44px;
            justify-content: center;
            padding: 0;
        }
        
        .bell .count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-btn {
            display: none;
        }
        
        #view {
            animation: fade .25s ease;
        }
        
        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        
        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .card-head h3 {
            font-size: 15px;
            font-weight: 700;
        }
        
        .link {
            color: var(--primary);
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        
        .icon-btn {
            color: var(--muted);
            display: inline-flex;
            padding: 5px;
            border-radius: 8px;
        }
        
        .icon-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }
        
        .icon-btn.red:hover {
            background: rgba(239, 68, 68, .12);
            color: var(--red);
        }
        
        .mb {
            margin-bottom: 18px;
        }
        
        .muted {
            color: var(--muted);
        }
        
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px 10px;
        }
        /* ---------- forms ---------- */
        
        .inp,
        .sel {
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 10px;
            padding: 9px 12px;
            min-width: 0;
        }
        
        .inp:focus,
        .sel:focus,
        .modal input:focus,
        .modal select:focus {
            outline: 2px solid rgba(109, 74, 255, .35);
            border-color: var(--primary);
        }
        
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 14px;
        }
        
        .toolbar .grow {
            flex: 1;
            min-width: 180px;
        }
        
        .searchbox {
            position: relative;
            flex: 1;
            min-width: 200px;
        }
        
        .searchbox svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            width: 16px;
            height: 16px;
        }
        
        .searchbox input {
            width: 100%;
            padding-left: 34px;
        }
        /* ---------- stats ---------- */
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 18px;
        }
        
        .stat {
            border-radius: 20px;
            padding: 18px;
            background: rgba(var(--c), .08);
            border: 1px solid rgba(var(--c), .2);
            transition: transform .2s;
            cursor: pointer;
        }
        
        .stat:hover {
            transform: translateY(-3px);
        }
        
        .stat .ico {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgb(var(--c));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        
        .stat .label {
            color: rgb(var(--c));
            font-weight: 600;
            font-size: 13px;
        }
        
        .stat .value {
            font-size: 26px;
            font-weight: 800;
            margin: 4px 0;
        }
        
        .stat .delta {
            font-size: 12px;
            color: var(--muted);
        }
        
        .stat .delta b {
            color: rgb(var(--c));
        }
        
        .stat svg.spark {
            width: 100%;
            height: 50px;
            margin-top: 12px;
            display: block;
        }
        
        .bar {
            height: 8px;
            border-radius: 99px;
            background: rgba(var(--c), .18);
            overflow: hidden;
            margin: 14px 0 10px;
        }
        
        .bar i {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: rgb(var(--c));
            width: 0;
            transition: width 1s ease;
        }
        
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        
        .kpi {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        
        .kpi .l {
            color: var(--muted);
            font-size: 12.5px;
        }
        
        .kpi .v {
            font-size: 22px;
            font-weight: 800;
            margin-top: 4px;
        }
        /* ---------- charts ---------- */
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }
        
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        
        .donut-wrap {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .donut {
            position: relative;
            width: 210px;
            height: 210px;
        }
        
        .donut svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        
        .donut circle {
            fill: none;
            stroke-width: 26;
            cursor: pointer;
            transition: stroke-width .15s;
        }
        
        .donut circle:hover {
            stroke-width: 31;
        }
        
        .donut .center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        
        .donut .center b {
            font-size: 20px;
        }
        
        .donut .center span {
            color: var(--muted);
            font-size: 12px;
        }
        
        .legend {
            flex: 1;
            min-width: 200px;
        }
        
        .legend-row {
            display: grid;
            grid-template-columns: 26px 1fr auto 52px;
            gap: 8px;
            align-items: center;
            padding: 7px 6px;
            font-size: 12.5px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .legend-row:hover {
            background: var(--primary-soft);
        }
        
        .ci {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .ci img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .bimg {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
        }
        
        .bimg .t b {
            display: block;
            font-size: 13px;
        }
        
        .bimg .t span {
            color: var(--muted);
            font-size: 12px;
        }
        
        .ci svg {
            width: 14px;
            height: 14px;
        }
        
        .legend-row .pct {
            color: var(--muted);
            text-align: right;
        }
        
        .callout {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--primary-soft);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 16px;
            font-size: 13px;
        }
        
        .callout b {
            color: var(--primary);
        }
        
        .chart-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }
        
        .chart-svg text {
            fill: var(--muted);
            font-size: 11px;
        }
        
        .compare {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-soft);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--muted);
        }
        
        .compare strong {
            display: block;
            color: var(--primary);
            font-size: 16px;
            margin-top: 3px;
        }
        
        .compare strong.good {
            color: var(--green);
        }
        
        .lg {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: var(--muted);
        }
        
        .lg i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 5px;
        }
        /* ---------- budgets / categories ---------- */
        
        .budgets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }
        
        .budget {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            background: var(--card);
        }
        
        .budget .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .budget .ci {
            width: 38px;
            height: 38px;
            border-radius: 11px;
        }
        
        .budget .ci svg {
            width: 18px;
            height: 18px;
        }
        
        .budget .name {
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .budget .amt {
            color: var(--muted);
            font-size: 12.5px;
            margin-bottom: 10px;
        }
        
        .track {
            height: 7px;
            border-radius: 99px;
            background: var(--border);
            overflow: hidden;
        }
        
        .track i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 99px;
            transition: width 1s ease;
        }
        
        .budget .p {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 6px;
            color: var(--muted);
        }
        
        .budget.over .p b {
            color: var(--red);
        }
        
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 99px;
            background: rgba(var(--c), .14);
            color: rgb(var(--c));
        }
        
        .cat-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .cat-card .top {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .cat-card .ci {
            width: 46px;
            height: 46px;
            border-radius: 14px;
        }
        
        .cat-card .ci svg {
            width: 22px;
            height: 22px;
        }
        
        .add-card {
            border: 2px dashed var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--muted);
            min-height: 160px;
            cursor: pointer;
            background: transparent;
        }
        
        .add-card:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        /* ---------- table ---------- */
        
        .table-wrap {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }
        
        th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
            font-size: 12px;
            padding: 8px 10px;
            white-space: nowrap;
        }
        
        td {
            padding: 12px 10px;
            border-top: 1px solid var(--border);
            font-size: 13px;
        }
        
        th.r,
        td.r {
            text-align: right;
        }
        
        tbody tr.clickable {
            cursor: pointer;
        }
        
        tbody tr.clickable:hover td {
            background: rgba(109, 74, 255, .05);
        }
        
        tfoot td {
            font-weight: 700;
        }
        
        .date {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }
        
        .date .di {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
        }
        
        .desc b {
            display: block;
            font-size: 13px;
        }
        
        .desc span {
            color: var(--muted);
            font-size: 12px;
        }
        
        .tag {
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(var(--c), .14);
            color: rgb(var(--c));
            white-space: nowrap;
        }
        
        .pay {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        
        .visa {
            font-style: italic;
            font-weight: 900;
            color: #1a3fb6;
            font-size: 13px;
        }
        
        body.dark .visa {
            color: #6f95ff;
        }
        
        .mc {
            position: relative;
            width: 24px;
            height: 15px;
            flex-shrink: 0;
        }
        
        .mc i {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
        }
        
        .mc i:first-child {
            background: #eb001b;
            left: 0;
        }
        
        .mc i:last-child {
            background: #f79e1b;
            left: 9px;
            opacity: .9;
        }
        
        .neg {
            color: var(--red);
            font-weight: 700;
            white-space: nowrap;
        }
        
        .pos {
            color: var(--green);
            font-weight: 700;
            white-space: nowrap;
        }
        
        .pager {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }
        
        .pager .pg {
            display: flex;
            gap: 4px;
        }
        
        .pager button {
            min-width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
        }
        
        .pager button.on {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        
        .pager button:disabled {
            opacity: .4;
            cursor: default;
        }
        
        input[type=checkbox].ck {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }
        /* ---------- goals ---------- */
        
        .goal {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .goal .head {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .ring {
            position: relative;
            width: 84px;
            height: 84px;
            flex-shrink: 0;
        }
        
        .ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        
        .ring circle {
            fill: none;
            stroke-width: 9;
        }
        
        .ring .c {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
        }
        
        .goal .emoji {
            font-size: 26px;
        }
        
        .goal .acts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        /* ---------- calendar ---------- */
        
        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        
        .cal .dow {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 6px 0;
            font-weight: 600;
        }
        
        .cal .day.out {
            opacity: .45;
        }
        
        .cal .cnt {
            color: var(--muted);
            font-size: 10.5px;
            margin-top: auto;
        }
        
        .cal .day {
            min-height: 98px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 7px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: pointer;
            background: var(--card);
            text-align: left;
            font-size: 11.5px;
        }
        
        .cal .day:hover {
            border-color: var(--primary);
        }
        
        .cal .day.empty-d {
            border: none;
            background: transparent;
            cursor: default;
        }
        
        .cal .day.today .n {
            background: var(--primary);
            color: #fff;
        }
        
        .cal .day.sel {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        
        .cal .n {
            font-weight: 700;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .cal .e {
            color: var(--red);
            font-weight: 600;
        }
        
        .cal .g {
            color: var(--green);
            font-weight: 600;
        }
        /* ---------- insights ---------- */
        
        .insight {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        
        .insight .ico {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(var(--c), .14);
            color: rgb(var(--c));
        }
        
        .insight h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .insight p {
            color: var(--muted);
            line-height: 1.5;
            font-size: 13px;
        }
        
        .insight .big {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 2px;
        }
        
        .score {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 8px;
        }
        
        .score svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        
        .score circle {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
        }
        
        .score .c {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .score .c b {
            font-size: 30px;
        }
        
        .tips {
            list-style: none;
            display: grid;
            gap: 10px;
        }
        
        .tips li {
            display: flex;
            gap: 10px;
            background: var(--primary-soft);
            border-radius: 12px;
            padding: 12px 14px;
            line-height: 1.45;
        }
        /* ---------- settings ---------- */
        
        .set-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        
        .set-row:first-of-type {
            border-top: none;
        }
        
        .set-row .t b {
            display: block;
        }
        
        .set-row .t span {
            color: var(--muted);
            font-size: 12.5px;
        }
        
        .tg {
            position: relative;
            display: inline-block;
            vertical-align: middle;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        
        .tg input {
            display: none;
        }
        
        .tg span {
            position: absolute;
            inset: 0;
            background: #c9cde4;
            border-radius: 99px;
            transition: .2s;
            cursor: pointer;
        }
        
        .tg span::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: .2s;
        }
        
        .tg input:checked+span {
            background: var(--primary);
        }
        
        .tg input:checked+span::before {
            transform: translateX(20px);
        }
        
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-soft);
            border-radius: 99px;
            padding: 6px 8px 6px 12px;
            font-size: 13px;
        }
        
        .chip button {
            display: flex;
            color: var(--muted);
        }
        
        .chip button:hover {
            color: var(--red);
        }
        /* ---------- modal, menu, toast ---------- */
        
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 30, .6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 16px;
        }
        
        .modal-bg.open {
            display: flex;
        }
        
        .modal {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            max-height: 92vh;
            overflow-y: auto;
        }
        
        .modal h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }
        
        .modal label.f {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
        }
        
        .modal input:not([type=radio]):not([type=checkbox]),
        .modal select {
            width: 100%;
            margin-top: 5px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
        }
        
        .modal .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .modal .actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        
        .modal .actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid var(--border);
        }
        
        .modal .actions .btn-primary {
            border: none;
        }
        
        .modal .actions .btn-danger {
            background: var(--red);
            color: #fff;
            border: none;
        }
        
        .seg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 14px;
        }
        
        .seg label {
            text-align: center;
            padding: 9px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            color: var(--muted);
        }
        
        .seg input {
            display: none;
        }
        
        .seg input:checked+span {
            color: #fff;
        }
        
        .seg label:has(input:checked) {
            background: var(--primary);
            color: #fff;
        }
        
        .seg label:has(input[value=expense]:checked) {
            background: var(--red);
        }
        
        .seg label:has(input[value=income]:checked) {
            background: var(--green);
        }
        
        .swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0 14px;
        }
        
        .swatches label {
            cursor: pointer;
        }
        
        .swatches input {
            display: none;
        }
        
        .swatches span {
            display: flex;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 3px solid transparent;
        }
        
        .swatches span svg {
            width: 15px;
            height: 15px;
        }
        
        .swatches input:checked+span {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        
        .swatches.ic span {
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            width: 36px;
            height: 36px;
        }
        
        .swatches.ic input:checked+span {
            background: var(--primary);
            color: #fff;
            outline: none;
        }
        
        .menu {
            position: fixed;
            z-index: 80;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
            padding: 6px;
            min-width: 170px;
        }
        
        .menu button {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 9px 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
        }
        
        .menu button:hover {
            background: var(--primary-soft);
        }
        
        .menu button.danger {
            color: var(--red);
        }
        
        .notif {
            position: absolute;
            top: 54px;
            right: 0;
            width: 340px;
            max-width: 92vw;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .2);
            z-index: 60;
            display: none;
            overflow: hidden;
        }
        
        .notif.open {
            display: block;
        }
        
        .notif header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
        }
        
        .notif .list {
            max-height: 360px;
            overflow-y: auto;
        }
        
        .notif .n {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        
        .notif .n:hover {
            background: var(--primary-soft);
        }
        
        .notif .n.unread {
            background: rgba(109, 74, 255, .06);
        }
        
        .notif .n .ico {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--c), .15);
            color: rgb(var(--c));
            flex-shrink: 0;
        }
        
        .notif .n b {
            display: block;
            font-size: 13px;
        }
        
        .notif .n span {
            color: var(--muted);
            font-size: 12px;
        }
        
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 80px);
            background: #151a33;
            color: #fff;
            padding: 10px 18px;
            border-radius: 99px;
            transition: .3s;
            z-index: 90;
            max-width: 90vw;
        }
        
        .toast.show {
            transform: translate(-50%, 0);
        }
        
        .tip {
            position: fixed;
            pointer-events: none;
            background: #151a33;
            color: #fff;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            z-index: 95;
            display: none;
            white-space: nowrap;
        }
        
        .banner {
            margin-top: 18px;
            border-radius: 22px;
            padding: 26px 30px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: linear-gradient(100deg, #6d4aff 0%, #8d6bff 55%, #5fa8ff 100%);
            overflow: hidden;
        }
        
        .banner h3 {
            font-size: 20px;
            margin-bottom: 6px;
        }
        
        .banner p {
            opacity: .85;
            margin-bottom: 16px;
        }
        
        .banner button {
            background: #fff;
            color: #3d2bb3;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 10px;
        }
        
        .banner button:hover {
            transform: translateY(-2px);
        }
        
        .banner svg {
            width: 190px;
            height: 120px;
            flex-shrink: 0;
        }
        /* ---------- accounts, messages, users ---------- */
        
        .viewonly {
            background: var(--primary-soft);
            color: var(--primary);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 13px;
        }
        
        .subtabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .subtabs button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--muted);
        }
        
        .subtabs button.on {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        
        .nb2 {
            background: var(--red);
            color: #fff;
            font-size: 10px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 99px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            font-weight: 700;
        }
        
        .inbox {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 270px);
            min-height: 440px;
            padding: 0;
            overflow: hidden;
        }
        
        .threads {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .th {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            width: 100%;
        }
        
        .th:hover {
            background: var(--primary-soft);
        }
        
        .th.on {
            background: var(--primary-soft);
            box-shadow: inset 3px 0 0 var(--primary);
        }
        
        .th .tx {
            flex: 1;
            min-width: 0;
        }
        
        .th .tx b {
            display: block;
        }
        
        .th .tx small {
            display: block;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .th .meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }
        
        .av2 {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6d4aff, #4fc3ff);
            color: #fff;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            font-size: 13px;
        }
        
        .av2 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .conv {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .conv .empty.big {
            margin: auto;
        }
        
        .chead {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .chead small {
            display: block;
            color: var(--muted);
        }
        
        .cmsgs {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .cm {
            display: flex;
            flex-direction: column;
            max-width: 78%;
        }
        
        .cm.me {
            align-self: flex-end;
            align-items: flex-end;
        }
        
        .bub2 {
            padding: 9px 13px;
            border-radius: 14px;
            line-height: 1.5;
            background: var(--primary-soft);
            overflow-wrap: anywhere;
        }
        
        .cm.me .bub2 {
            background: linear-gradient(90deg, #6d4aff, #8466ff);
            color: #fff;
        }
        
        .cm small {
            color: var(--muted);
            font-size: 11px;
            margin: 2px 6px 0;
        }
        
        .reply {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        
        .reply input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 12px;
            padding: 11px 14px;
        }
        
        .reply input:focus,
        .f input:focus,
        .f textarea:focus {
            outline: 2px solid rgba(109, 74, 255, .35);
            border-color: var(--primary);
        }
        
        .f {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .f input,
        .f textarea {
            display: block;
            width: 100%;
            margin-top: 5px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            font: inherit;
            resize: vertical;
        }
        
        .faqrow {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-top: 1px solid var(--border);
        }
        
        .faqrow:first-of-type {
            border-top: 0;
        }
        
        .faqrow p {
            color: var(--muted);
            font-size: 13px;
            margin: 3px 0;
            line-height: 1.45;
        }
        
        .faqrow small {
            color: var(--primary);
        }
        
        .testout {
            margin-top: 12px;
            line-height: 1.5;
        }
        
        .testout .bub2 {
            margin-top: 6px;
            display: inline-block;
        }
        
        .perm {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 8px 0;
            line-height: 1.4;
            cursor: pointer;
        }
        
        .perm input {
            margin-top: 2px;
            flex-shrink: 0;
        }
        
        .hint2 {
            display: block;
            font-weight: 400;
            margin-top: 4px;
        }
        
        button[disabled] {
            opacity: .4;
            cursor: not-allowed;
        }
        
        @media (max-width: 800px) {
            .inbox {
                grid-template-columns: 1fr;
                height: auto;
            }
            .threads {
                max-height: 220px;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }
            .conv {
                min-height: 380px;
            }
        }
        /* ---------- fuller control of users and chats ---------- */
        
        .threads-col {
            display: flex;

function sparkline(pts, c) {
  const w = 200, h = 50, max = Math.max(...pts), min = Math.min(...pts), rng = max - min || 1;
  const xy = pts.map((v, i) => [i / (pts.length - 1) * w, h - 6 - (v - min) / rng * (h - 14)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const id = 'sg' + c.replace(/,/g, '');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(${c})" stop-opacity=".25"/><stop offset="1" stop-color="rgb(${c})" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="rgb(${c})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function donutSvg(items, total) {
  const r = 78, C = 2 * Math.PI * r, gap = items.length > 1 ? 2.5 : 0;
  let off = 0, out = `<circle cx="100" cy="100" r="${r}" stroke="var(--border)" style="pointer-events:none"/>`;
  items.forEach(c => {
    const len = c.value / total * C;
    out += `<circle cx="100" cy="100" r="${r}" stroke="${c.color}" stroke-dasharray="${Math.max(len - gap, 0)} ${C}" stroke-dashoffset="${-off}" data-act="go" data-go="transactions" data-cat="${c.id}" data-tip="${esc(c.name)}: ${money(c.value)} (${(c.value / total * 100).toFixed(1)}%)"/>`;
    off += len;
  });
  return out;
}
function areaChart(values, labels, dateOf) {
  const W = 520, H = 280, L = 46, R = 12, T = 18, B = 34, last = values.length - 1;
  const { top, step } = nice(Math.max(...values, 1));
  const x = i => L + (last ? i / last : 0) * (W - L - R), y = v => T + (1 - v / top) * (H - T - B);
  let g = '';
  for (let v = 0; v <= top + 0.001; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-dasharray="${v ? '3 4' : ''}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${axisLabel(v)}</text>`;
  labels.forEach(([i, l]) => { g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${l}</text>`; });
  const pts = values.map((v, i) => [x(i), y(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const lp = pts[last];
  g += `<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d4aff" stop-opacity=".3"/><stop offset="1" stop-color="#6d4aff" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${lp[0]} ${y(0)} L${L} ${y(0)} Z" fill="url(#tg)"/>
    <path d="${line}" fill="none" stroke="#6d4aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="transparent" data-tip="${dateOf(i)}: ${money(values[i])}"/>`; });
  const bx = Math.max(L, Math.min(lp[0] - 62, W - R - 90));
  g += `<circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="#fff" stroke="#6d4aff" stroke-width="3"/>
    <g transform="translate(${bx},${Math.max(2, lp[1] - 54)})"><rect width="90" height="40" rx="9" fill="var(--card)" stroke="var(--border)"/>
    <text x="10" y="18" style="fill:#6d4aff;font-weight:700;font-size:12px">${money(values[last])}</text><text x="10" y="32">${dateOf(last)}</text></g>`;
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function groupedBars(data) { // [{label, a, b}] a = income, b = expense
  const W = 620, H = 270, L = 50, R = 10, T = 14, B = 30;
  const { top, step } = nice(Math.max(...data.flatMap(d => [d.a, d.b]), 1));
  const y = v => T + (1 - v / top) * (H - T - B), bw = (W - L - R) / data.length;
  let g = '';
  for (let v = 0; v <= top + 0.001; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${axisLabel(v)}</text>`;
  data.forEach((d, i) => {
    const x0 = L + i * bw + bw * 0.15, w = bw * 0.35;
    g += `<rect x="${x0}" y="${y(d.a)}" width="${w}" height="${Math.max(y(0) - y(d.a), 0)}" rx="4" fill="#22c55e" data-tip="${d.label} income: ${money(d.a)}"/>`;
    g += `<rect x="${x0 + w + 3}" y="${y(d.b)}" width="${w}" height="${Math.max(y(0) - y(d.b), 0)}" rx="4" fill="#6d4aff" data-tip="${d.label} expenses: ${money(d.b)}"/>`;
    g += `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${d.label}</text>`;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function simpleBars(vals, labels, color = '#6d4aff') {
  const W = 420, H = 190, L = 44, R = 8, T = 10, B = 26;
  const { top, step } = nice(Math.max(...vals, 1));
  const y = v => T + (1 - v / top) * (H - T - B), bw = (W - L - R) / vals.length;
  let g = '';
  for (let v = 0; v <= top + 0.001; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${axisLabel(v)}</text>`;
  vals.forEach((v, i) => {
    g += `<rect x="${L + i * bw + bw * 0.18}" y="${y(v)}" width="${bw * 0.64}" height="${Math.max(y(0) - y(v), 0)}" rx="5" fill="${color}" data-tip="${labels[i]}: ${money(v)}"/><text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function ringSvg(pct, color, size = 84) {
  const r = 36, C = 2 * Math.PI * r;
  return `<svg viewBox="0 0 84 84" width="${size}" height="${size}"><circle cx="42" cy="42" r="${r}" stroke="var(--border)"/><circle cx="42" cy="42" r="${r}" stroke="${color}" stroke-linecap="round" stroke-dasharray="${C * clamp(pct, 0, 100) / 100} ${C}"/></svg>`;
}

/* ---------- Transactions ---------- */
function filteredTx() {
  const f = ui.tx; let a = S.transactions.slice();
  if (f.scope === 'month') a = a.filter(t => t.date >= ui.range.from && t.date <= ui.range.to);
  if (f.type !== 'all') a = a.filter(t => t.type === f.type);
  if (f.cat !== 'all') a = a.filter(t => t.cat === f.cat);
  if (f.pay !== 'all') a = a.filter(t => t.pay === f.pay);
  if (f.att === 'with') a = a.filter(t => filesOf(t).length);
  if (f.att === 'none') a = a.filter(t => !filesOf(t).length);
  if (f.q.trim()) { const q = f.q.trim().toLowerCase(); a = a.filter(t => `${t.title} ${t.merchant} ${catInfo(t).name}`.toLowerCase().includes(q)); }
  const sorts = { new: (x, y) => y.date.localeCompare(x.date), old: (x, y) => x.date.localeCompare(y.date), high: (x, y) => y.amount - x.amount, low: (x, y) => x.amount - y.amount };
  return a.sort(sorts[f.sort]);
}

function resizeImage(file, max, ratio) { // ratio = width / height; crops from the centre when given
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Please choose an image file'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), g = c.getContext('2d');
      if (ratio) {
        // centre-crop the source to the wanted shape, then scale to the target width
        let sw = img.width, sh = img.width / ratio;
        if (sh > img.height) { sh = img.height; sw = img.height * ratio; }
        c.width = Math.min(max, Math.round(sw)); c.height = Math.round(c.width / ratio);
        g.fillStyle = '#0f1230'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        return res(c.toDataURL('image/jpeg', 0.9));
      }
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL(file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a readable image')); };
    img.src = url;
  });
}

const AI = { msgs: [], busy: false, claude: false };
ui.drawer = null;
const say = html => ({ html });
const plain = h => h.replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, '');
const mdLite = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^[-*] (.+)$/gm, '• $1').replace(/\n/g, '<br>');

/* ---------- understanding the question ---------- */
const CAT_WORDS = {
  food: ['food', 'grocer', 'restaurant', 'coffee', 'lunch', 'dinner', 'meal', 'snack', 'eating'],
  transport: ['transport', 'uber', 'taxi', 'gas\\b', 'fuel', 'parking', 'bus\\b', 'commut', 'car\\b'],
  housing: ['housing', 'rent\\b', 'mortgage', 'household'],
  utilities: ['utilit', 'electric', 'water', 'internet', 'phone', 'bills?\\b'],
  entertainment: ['entertain', 'movie', 'netflix', 'spotify', 'game', 'concert', 'cinema', 'fun\\b'],
  others: ['misc', 'pharmacy', 'gift', 'shopping'],
};
function findCat(text) {
  const t = text.toLowerCase();
  const byName = S.categories.find(c => new RegExp('\\b' + c.name.toLowerCase().replace(/[^a-z0-9 ]/g, '') + '\\b').test(t));
  if (byName) return byName;
  for (const [id, words] of Object.entries(CAT_WORDS)) {
    const c = catById(id);
    if (c && words.some(w => new RegExp('\\b' + w, 'i').test(t))) return c;
  }
  return null;
}
function aiRange(t) {
  const map = [['today', 'today'], ['yesterday', 'yesterday'], ['this week', 'thisweek'], ['last week', 'lastweek'], ['last 7 days', 'last7'], ['last 30 days', 'last30'], ['this month', 'month'], ['last month', 'lastmonth'], ['this year', 'year']];
  for (const [phrase, key] of map) if (t.includes(phrase)) { const [from, to] = presetRange(key); return { from, to, said: phrase }; }
  return { from: ui.range.from, to: ui.range.to, said: '' };
}
function prevOf(from, to) {
  if (isFullMonth(from, to)) { const pm = shiftMonth(mOf(from), -1); return [monthStart(pm), monthEnd(pm)]; }
  const n = daysBetween(from, to); return [addDays(from, -n), addDays(from, -1)];
}
const txBetween = (from, to) => S.transactions.filter(t => t.date >= from && t.date <= to);

/* ---------- things the assistant can do ---------- */
function aiCommand(text) {
  const t = text.trim();
  let m = t.match(/(?:set|change|update|make)\s+(?:the\s+)?(.+?)\s+budget\s+(?:to|at|=)\s*\$?(\d+(?:\.\d+)?)/i) || t.match(/budget\s+(?:for\s+)?(.+?)\s+(?:to|at)\s*\$?(\d+(?:\.\d+)?)/i);
  if (m) {
    if (!CAN.edit) return say("I can't change budgets for you because your role is view-only.");
    const c = findCat(m[1]);
    if (!c) return say(`I couldn't find a category called “${esc(m[1])}”.`);
    c.limit = +m[2]; refresh();
    return say(`Done. The <b>${esc(c.name)}</b> budget is now <b>${money(c.limit, 0)}</b> a month.`);
  }
  m = t.match(/^(?:please\s+)?(?:(?:add|log|record|create)\s+(?:an?\s+)?(?:new\s+)?(expense|income|spending|transaction)?\s*(?:of\s+)?|i\s+(spent|paid|bought|earned|received)\s+)\$?(\d+(?:\.\d+)?)\s*(.*)$/i);
  if (!m) return null;
  const amount = +m[3], kind = (m[1] || m[2] || '').toLowerCase();
  if (!(amount > 0)) return null;
  if (!CAN.edit) return say("I can't add transactions for you because your role is view-only.");
  let rest = m[4].trim().replace(/^(on|for|at|to|from)\s+/i, '');
  const income = /income|earned|received/.test(kind) || /\b(salary|freelance|bonus|refund)\b/i.test(rest);
  let merchant = '';
  const at = rest.match(/^(.*?)\s+at\s+(.+)$/i);
  if (at) { rest = at[1]; merchant = at[2]; }
  const title = (rest || (income ? 'Income' : 'Expense')).replace(/^\w/, c => c.toUpperCase()).slice(0, 40);
  const cat = income ? (/salary/i.test(rest) ? 'Salary' : /freelance/i.test(rest) ? 'Freelance' : 'Other Income') : (findCat(rest + ' ' + merchant) || othersCat()).id;
  const date = localISO(new Date());
  const tx = { id: uid(), type: income ? 'income' : 'expense', date, title, merchant: merchant.slice(0, 40), cat, pay: S.payments[0], amount: r2(amount), files: [] };
  S.transactions.push(tx);
  if (date < ui.range.from || date > ui.range.to) setRange(monthStart(mOf(date)), monthEnd(mOf(date)));
  refresh();
  const c = income ? { name: cat } : catById(cat);
  return say(`Added ${income ? 'income' : 'an expense'} of <b>${money(tx.amount)}</b> for “${esc(title)}”${merchant ? ` at ${esc(merchant)}` : ''} under <b>${esc(c ? c.name : 'Others')}</b>, dated today. <button class="btn sm" data-act="ai-undo" data-id="${tx.id}">Undo</button>`);
}

/* ---------- answers from your data ---------- */
function aiQuestion(text) {
  const t = text.toLowerCase().trim(), rg = aiRange(t), list = txBetween(rg.from, rg.to);
  const exp = sumOf(list, 'expense'), inc = sumOf(list, 'income'), cat = findCat(t);
  const per = `<span class="muted">(${esc(rangeLabel(rg.from, rg.to))})</span>`, has = re => re.test(t);
  const nExp = list.filter(x => x.type === 'expense').length;

  if (has(/^(hi|hello|hey|hai|good (morning|afternoon|evening))\b/)) return say(`Hi ${esc(myName())}! What would you like to know about your money?`);
  if (has(/\b(help|what can you|how do you|commands?)\b/)) return say('I can answer questions and make small changes:<br>• <i>How much did I spend on food last month?</i><br>• <i>What was my biggest expense this week?</i><br>• <i>Am I over budget?</i> · <i>Spending forecast</i><br>• <i>Add expense 12.50 coffee at Starbucks</i><br>• <i>Set food budget to 600</i><br>• <i>Any problems in my data?</i>');

  const nav = t.match(/^(?:show|open|go to|take me to|see)\b.*?\b(overview|transactions?|categories|budgets?|goals?|reports?|calendar|insights?|settings?)\b/);
  if (nav) { const v = { transaction: 'transactions', category: 'categories', budget: 'budgets', goal: 'goals', report: 'reports', insight: 'insights', setting: 'settings' }[nav[1].replace(/s$/, '')] || nav[1]; const key = VIEWS[v] ? v : (VIEWS[nav[1]] ? nav[1] : 'overview'); return say(`Opening ${VIEWS[key][0]}… <button class="btn sm" data-act="go" data-go="${key}">Go</button>`); }

  if (has(/\b(alerts?|problems?|errors?|issues?|wrong|mistakes?|anomal)/)) {
    const a = detectAlerts();
    if (!a.length) return say('I scanned your data and found <b>no problems</b>. 🎉');
    return say(`I found <b>${a.length}</b> thing${a.length > 1 ? 's' : ''} worth a look:<br>${a.slice(0, 4).map(x => '• ' + esc(x.title) + ': ' + esc(x.text)).join('<br>')}${a.length > 4 ? `<br>…and ${a.length - 4} more.` : ''} <button class="btn sm" data-act="alerts-open">Open AI Alerts</button>`);
  }
  if (has(/\b(receipts?|attachments?|documents?)\b/)) {
    const need = list.filter(x => x.type === 'expense' && x.amount >= 100 && !filesOf(x).length);
    const have = list.filter(x => filesOf(x).length).length;
    return say(`${have} transaction${have === 1 ? ' has' : 's have'} receipts or documents ${per}. ${need.length ? `<b>${need.length}</b> expense${need.length > 1 ? 's' : ''} of ${money(100, 0)}+ ${need.length > 1 ? 'are' : 'is'} missing one.` : 'Every large expense has a receipt.'}`);
  }
  if (has(/\b(budgets?|overspen\w*|over budget|limits?)\b/)) {
    const bs = budgetStats(ui.month).list;
    if (cat) { const b = bs.find(x => x.id === cat.id); if (!b) return say(`${esc(cat.name)} has no budget yet. Say “set ${esc(cat.name.toLowerCase())} budget to 500” to create one.`); return say(`<b>${esc(b.name)}</b>: ${money(b.spent)} of ${money(b.limit, 0)} used (<b>${b.pct}%</b>). ${b.pct > 100 ? `You are over by ${money(b.spent - b.limit)}.` : `${money(b.limit - b.spent)} left.`}`); }
    if (!bs.length) return say('You have no budgets yet. Use the New Budget button to create one.');
    const over = bs.filter(x => x.pct > 100), near = bs.filter(x => x.pct >= S.settings.threshold && x.pct <= 100);
    return say(`${monthLabel(ui.month)}: ${over.length ? `<b>${over.length}</b> over budget (${over.map(x => esc(x.name)).join(', ')})` : 'nothing is over budget'}${near.length ? `, and ${near.map(x => esc(x.name)).join(', ')} ${near.length > 1 ? 'are' : 'is'} close to the limit` : ''}.<br>` + bs.map(x => `• ${esc(x.name)}: ${x.pct}% (${money(x.spent, 0)} / ${money(x.limit, 0)})`).join('<br>'));
  }
  if (has(/\bgoals?\b/)) {
    if (!S.goals.length) return say('You have no savings goals yet. Click “Set a Savings Goal” on the Overview to start one.');
    return say(S.goals.map(g => { const p = Math.round(g.saved / g.target * 100); return `• ${esc(g.emoji)} <b>${esc(g.name)}</b>: ${money(g.saved, 0)} of ${money(g.target, 0)} (${p}%)${g.saved >= g.target ? ' ✅' : ''}`; }).join('<br>'));
  }
  if (has(/forecast|project|predict|end of (the )?month|on track|\bwill i\b|how much will/)) {
    const today = localISO(new Date());
    if (today < rg.from || today > rg.to) return say(`That period is not running right now, so there is nothing to forecast. Total spending was <b>${money(exp)}</b>.`);
    const elapsed = daysBetween(rg.from, today), total = daysBetween(rg.from, rg.to), proj = exp / elapsed * total;
    return say(`You have spent <b>${money(exp)}</b> in ${elapsed} of ${total} days ${per}. At this pace you will reach about <b>${money(proj)}</b> by the end of the period${inc ? ` against ${money(inc)} of income` : ''}.`);
  }
  if (has(/biggest|largest|highest|most expensive|top expense|priciest/)) {
    const top = list.filter(x => x.type === 'expense').sort((a, c) => c.amount - a.amount).slice(0, 3);
    if (!top.length) return say(`No expenses ${per}.`);
    return say(`Your biggest expense${top.length > 1 ? 's' : ''} ${per}:<br>` + top.map((x, i) => `${i + 1}. <b>${money(x.amount)}</b> ${esc(x.title)}${x.merchant ? ' · ' + esc(x.merchant) : ''} (${fmtDate(x.date)})`).join('<br>'));
  }
  if (has(/categor|breakdown|where (does|did|is).*(money|spend)|top spending/) && !cat) {
    const sp = spentOf(list), rows = S.categories.map(c => ({ c, v: sp[c.id] || 0 })).filter(r => r.v > 0).sort((a, c) => c.v - a.v);
    if (!rows.length) return say(`No expenses ${per}.`);

  if (has(/compare|versus|\bvs\b|than (last|the previous)|difference|change/)) {

    const vsPrev = /(with|to|than|vs\.?|versus)\s+(the\s+)?(last|previous)/.test(t);
    const cf = vsPrev ? ui.range.from : rg.from, ct = vsPrev ? ui.range.to : rg.to, ce = vsPrev ? sumOf(txBetween(cf, ct), 'expense') : exp;
    const [pf, pt] = prevOf(cf, ct), pe = sumOf(txBetween(pf, pt), 'expense');

    return say(`You spent <b>${money(ce)}</b> in ${esc(rangeLabel(cf, ct))} versus <b>${money(pe)}</b> in ${esc(rangeLabel(pf, pt))}. That is <b>${money(Math.abs(d))} ${d >= 0 ? 'more' : 'less'}</b> (${Math.abs(d / pe * 100).toFixed(1)}%).`);
  }
  if (has(/average|per day|daily/)) { const days = daysBetween(rg.from, rg.to); return say(`You spend about <b>${money(exp / days)}</b> a day ${per}.`); }
  if (has(/sav(e|ed|ing)|left over|\bnet\b|balance|keep/)) {
    const net = inc - exp;
    return say(`Income was ${money(inc)} and expenses ${money(exp)} ${per}, so you ${net >= 0 ? 'saved' : 'overspent by'} <b>${money(Math.abs(net))}</b>${inc ? ` (savings rate ${(net / inc * 100).toFixed(1)}%)` : ''}.`);
  }

  if (has(/how many|number of|count/)) return say(`There ${list.length === 1 ? 'is' : 'are'} <b>${list.length}</b> transaction${list.length === 1 ? '' : 's'} ${per}: ${nExp} expense${nExp === 1 ? '' : 's'} and ${list.length - nExp} income.`);

async function aiAnswer(text) {

  if (cmd) return cmd;
  if (AI.claude) {
    try {
      const messages = AI.msgs.filter(m => !m.typing && (m.raw || m.html)).slice(-10).map(m => ({ role: m.role, content: m.raw || plain(m.html) }));
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages, context: aiContext() }) });
      if (!r.ok) throw new Error('chat failed');
      const j = await r.json();
      if (j.reply) return say(mdLite(j.reply));
    } catch (e) { /* fall back to the local assistant */ }
  }
  return aiQuestion(text);
}

async function aiSend(text) {
  if (AI.busy || !text.trim()) return;
  AI.busy = true;
  AI.msgs.push({ role: 'user', raw: text });
  const typing = { role: 'assistant', typing: true };
  AI.msgs.push(typing); renderChat();
  let res;
  try { res = await aiAnswer(text); } catch (e) { res = say('Sorry, something went wrong. Please try again.'); }
  await wait(250);
  AI.msgs.splice(AI.msgs.indexOf(typing), 1, { role: 'assistant', html: res.html, raw: plain(res.html) });
  AI.busy = false; renderChat();
}

/* ---------- AI alerts ---------- */
const LEVELS = { error: { label: 'Critical', c: '239,68,68' }, warn: { label: 'Warning', c: '245,158,11' }, info: { label: 'Info', c: '59,130,246' } };
function detectAlerts(includeDismissed = false) {
  const out = [], today = localISO(new Date()), m = ui.month, T = S.transactions;
  const push = (level, key, icon, title, text, actions = []) => out.push({ level, key, icon, title, text, actions });
  const fix = t => ({ label: 'Fix it', act: 'tx-edit', data: { id: t.id } });

  // data errors
  T.forEach(t => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.date || '')) push('error', `date-${t.id}`, 'alert', 'Invalid date', `“${t.title}” has no valid date.`, [fix(t)]);
    else if (t.date > today) push('error', `future-${t.id}`, 'cal', 'Dated in the future', `“${t.title}” (${money(t.amount)}) is dated ${fmtDate(t.date)}.`, [fix(t)]);
    if (!(t.amount > 0)) push('error', `amt-${t.id}`, 'alert', 'Invalid amount', `“${t.title}” has an amount of ${t.amount}.`, [fix(t)]);
    if (t.type === 'expense' && !catById(t.cat)) push('error', `cat-${t.id}`, 'grid', 'Category missing', `“${t.title}” points to a category that no longer exists.`, [fix(t)]);
  });

  // possible duplicates
  const seen = {};
  T.forEach(t => { const k = [t.type, t.date, (t.merchant || t.title).toLowerCase(), t.amount].join('|'); (seen[k] ||= []).push(t); });
  Object.entries(seen).filter(([, v]) => v.length > 1).forEach(([k, v]) =>
    push('warn', `dup-${k}`, 'copy', 'Possible duplicate', `${v.length} identical entries of ${money(v[0].amount)} at ${v[0].merchant || v[0].title} on ${fmtDate(v[0].date)}.`,
      [{ label: 'Review', act: 'alert-search', data: { q: v[0].merchant || v[0].title } }]));

  // unusually large expenses (recent ones, compared with the same category's usual size)
  const since = addDays(today, -60), byCat = {};
  T.filter(t => t.type === 'expense' && t.amount > 0).forEach(t => { (byCat[t.cat] ||= []).push(t); });
  Object.values(byCat).forEach(arr => {
    if (arr.length < 6) return;
    const sorted = arr.map(t => t.amount).sort((a, b) => a - b), med = sorted[Math.floor(sorted.length / 2)];
    arr.filter(t => t.date >= since && t.date <= today && t.amount >= 50 && t.amount >= med * 5).forEach(t =>
      push('warn', `big-${t.id}`, 'trend', 'Unusually large expense', `${money(t.amount)} for “${t.title}” is ${(t.amount / med).toFixed(1)}× your usual ${catInfo(t).name} purchase (${money(med, 0)}).`, [{ label: 'Review', act: 'tx-edit', data: { id: t.id } }]));
  });

  // budgets
  budgetStats(m).list.forEach(c => {
    if (c.pct > 100) push('error', `over-${c.id}-${m}`, 'alert', `${c.name} is over budget`, `${money(c.spent)} spent of ${money(c.limit, 0)} in ${monthLabel(m)} (${c.pct}%).`, [{ label: 'Adjust budget', act: 'bud-edit', data: { id: c.id } }, { label: 'See spending', act: 'go', data: { go: 'transactions', cat: c.id } }]);
    else if (c.pct >= S.settings.threshold) push('warn', `near-${c.id}-${m}`, 'clock', `${c.name} is at ${c.pct}% of budget`, `Only ${money(c.limit - c.spent)} left for ${monthLabel(m)}.`, [{ label: 'Adjust budget', act: 'bud-edit', data: { id: c.id } }]);
  });

  // spending spikes versus last month
  const cur = spentByCat(m), prev = spentByCat(shiftMonth(m, -1));
  S.categories.forEach(c => {
    const a = cur[c.id] || 0, p = prev[c.id] || 0;
    if (p > 0 && a >= p * 1.5 && a - p >= 50) push('warn', `spike-${c.id}-${m}`, 'trend', `${c.name} spending jumped`, `${money(a)} this month, up ${Math.round((a / p - 1) * 100)}% from ${money(p)} last month.`, [{ label: 'View', act: 'go', data: { go: 'transactions', cat: c.id } }]);
  });

  // month level checks
  const mt = txs(m), inc = sumOf(mt, 'income'), exp = sumOf(mt, 'expense');
  if (inc > 0 && exp > inc) push('warn', `neg-${m}`, 'down', 'Spending is higher than income', `${monthLabel(m)}: ${money(exp)} out vs ${money(inc)} in (${money(exp - inc)} deficit).`, [{ label: 'Open reports', act: 'go', data: { go: 'reports' } }]);
  if (inc === 0 && exp > 0) push('info', `noinc-${m}`, 'info', 'No income recorded', `${monthLabel(m)} has expenses but no income yet.`, [{ label: 'Add income', act: 'tx-add', data: {} }]);
  const noRec = mt.filter(t => t.type === 'expense' && t.amount >= 100 && !filesOf(t).length);
  if (noRec.length) push('info', `norec-${m}`, 'clip', 'Receipts missing', `${noRec.length} expense${noRec.length > 1 ? 's' : ''} of ${money(100, 0)} or more in ${monthLabel(m)} ${noRec.length > 1 ? 'have' : 'has'} no receipt attached.`, [{ label: 'Show them', act: 'alert-norec', data: {} }]);

  // goals
  S.goals.filter(g => g.saved < g.target).forEach(g => {
    const days = Math.ceil((new Date(g.deadline + 'T00:00:00') - new Date()) / 864e5);
    if (days < 0) push('warn', `goal-late-${g.id}`, 'target', `${g.name}: deadline passed`, `${money(g.target - g.saved)} is still missing.`, [{ label: 'Edit goal', act: 'goal-edit', data: { id: g.id } }]);
    else if (days <= 30 && g.saved / g.target < 0.5) push('warn', `goal-behind-${g.id}`, 'target', `${g.name} is behind schedule`, `${days} days left and only ${Math.round(g.saved / g.target * 100)}% saved.`, [{ label: 'Add funds', act: 'goal-fund', data: { id: g.id } }]);
  });

  const rank = { error: 0, warn: 1, info: 2 }, gone = S.dismissed || [];
  return out.filter(a => includeDismissed || !gone.includes(a.key)).sort((a, b) => rank[a.level] - rank[b.level]);
}
function renderAlerts() {
  const all = detectAlerts(), n = all.filter(a => a.level !== 'info').length;
  const badge = $('#alertCount'); badge.textContent = n; badge.style.display = n ? 'flex' : 'none';
  $('#alertBtn').classList.toggle('hot', all.some(a => a.level === 'error'));
  const dismissed = (S.dismissed || []).length;
  $('#alertList').innerHTML = (all.length ? `<div class="al-sum">${all.length} item${all.length > 1 ? 's' : ''} found · ${all.filter(a => a.level === 'error').length} critical</div>` : '<div class="empty" style="padding:40px 10px">' + ic('check', 36) + '<br><b>All clear</b><br>No errors or unusual activity found.</div>')
    + all.map(a => {
      const L = LEVELS[a.level];
      return `<div class="al" style="--c:${L.c}"><span class="ico">${ic(a.icon, 18)}</span><div class="body"><div class="top"><b>${esc(a.title)}</b><span class="badge" style="--c:${L.c}">${L.label}</span></div><p>${esc(a.text)}</p>
        <div class="acts">${a.actions.map(x => `<button type="button" class="btn sm" data-act="${x.act}" ${Object.entries(x.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${esc(x.label)}</button>`).join('')}<button type="button" class="btn sm" data-act="alert-dismiss" data-key="${esc(a.key)}">Dismiss</button></div></div></div>`;
    }).join('')
    + (dismissed ? `<div class="al-foot">${dismissed} dismissed · <a class="link" data-act="alert-restore">Restore all</a></div>` : '');
}

async function req(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.replace('/login'); throw new Error('Signed out'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
const ago = ms => {
  if (!ms) return 'never';
  const d = Date.now() - ms, m = Math.floor(d / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} d ago`;
};
