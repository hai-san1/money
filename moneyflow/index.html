const INBOX = { threads: [], unread: 0, active: null, msgs: [], last: 0, sig: '', tab: 'inbox', filter: 'all', q: '', portal: null, quick: null, openAfter: null };

const threadOf = id => INBOX.threads.find(t => t.id === id);
const sigOf = t => (t ? `${t.status}|${t.muted}` : '');

function vMessages() {

}
function afterMessages() {

}
async function loadQuick() {
  if (INBOX.quick) return;
  try { INBOX.quick = (await req('GET', '/api/quick-replies')).items; } catch (e) { INBOX.quick = []; }

async function pollInbox() {
  if (!CAN.reply || !API.on || document.hidden) return;
  try {
    const j = await req('GET', '/api/chats');
    INBOX.threads = j.threads; INBOX.unread = j.unread; applyMsgBadge();
    if (ui.view !== 'messages' || INBOX.tab !== 'inbox') return;
    renderFilters(); renderThreads();
    if (INBOX.openAfter) { const id = INBOX.openAfter; INBOX.openAfter = null; if (threadOf(id)) return openThread(id); }
    if (INBOX.active && threadOf(INBOX.active)) {
      const m = await req('GET', `/api/chats/${INBOX.active}/messages?after=${INBOX.last}`);
      const changed = m.messages.length || sigOf(threadOf(INBOX.active)) !== INBOX.sig;
      if (m.messages.length) { INBOX.msgs.push(...m.messages); INBOX.last = m.messages[m.messages.length - 1].id; }
      if (changed) renderConv();
    }
    const tb = document.querySelector('.subtabs [data-t=inbox]');
    if (tb) tb.innerHTML = `${ic('chat', 16)} Inbox${INBOX.unread ? `<span class="nb2">${INBOX.unread}</span>` : ''}`;
  } catch (e) { /* offline: try again on the next tick */ }
}
function visibleThreads() {

    if (INBOX.filter === 'unread' && !t.unread) return false;
    if (INBOX.filter === 'open' && t.status === 'resolved') return false;

}
function renderFilters() {

}
function renderThreads() {

}
function renderConv() {
  const el = $('#conv'); if (!el) return;

      <button class="btn sm" data-act="conv-status">${t.status === 'resolved' ? ic('refresh', 14) + ' Reopen' : ic('check', 14) + ' Mark resolved'}</button>

    <div class="quick">${(INBOX.quick || []).map((q, i) => `<button class="chip-btn" data-act="quick-use" data-i="${i}" title="${esc(q)}">${esc(short(q))}</button>`).join('')}<button class="chip-btn ghost" data-act="quick-edit">${ic('edit', 12)} Edit quick replies</button></div>

}
async function openThread(id) {
  INBOX.active = id; INBOX.msgs = []; INBOX.last = 0;

    const j = await req('GET', `/api/chats/${id}/messages`);

    const t = threadOf(id); if (t) { if (t.status !== 'resolved') INBOX.unread = Math.max(0, INBOX.unread - t.unread); t.unread = 0; }

/* forms, selects and switches rendered by the pages above */
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'replyForm') {
    e.preventDefault();
    const i = $('#replyIn'), body = i.value.trim(); if (!body || !INBOX.active) return;
    try { const j = await req('POST', `/api/chats/${INBOX.active}/messages`, { body }); i.value = ''; INBOX.msgs.push(j.message); INBOX.last = j.message.id; pollInbox(); renderConv(); }
    catch (err) { toast(err.message); }
  } else if (f.id === 'infoForm') {
    e.preventDefault();
    try {
      const j = await req('PUT', '/api/portal', { storeName: $('#piStore').value, about: $('#piAbout').value, hours: $('#piHours').value, contact: $('#piContact').value, address: $('#piAddress').value, replyTime: $('#piReply').value });
      INBOX.portal.info = j.info; toast('Information saved');
    } catch (err) { toast(err.message); }
  } else if (f.id === 'testForm') {
    e.preventDefault();
    const q = $('#testIn').value.trim(); if (!q) return;
    try { const j = await req('POST', '/api/my/ai', { body: q }); const a = j.messages[1]; $('#testOut').innerHTML = `<b>Customers would see:</b><div class="bub2">${esc(a.body).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}</div>${j.handoff ? '<small>…and a button to message the admin.</small>' : ''}`; }
    catch (err) { toast(err.message); }
  } else if (f.id === 'pwForm') {
    e.preventDefault();
    try { await req('PATCH', '/api/me', { currentPassword: $('#pwCur').value, newPassword: $('#pwNew').value }); f.reset(); toast('Password updated'); }
    catch (err) { toast(err.message); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.uf === 'q') { USERS.q = t.value; renderUserRows(); }
  if (t.dataset.mq !== undefined) { INBOX.q = t.value; renderThreads(); }
  if (t.dataset.aq !== undefined) { USERS.auditQ = t.value; renderAudit(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.uf === 'role') { USERS.role = t.value; renderUserRows(); }
  if (t.dataset.uf === 'status') { USERS.status = t.value; renderUserRows(); }
  if (t.dataset.usel) { const id = +t.dataset.usel; t.checked ? USERS.sel.add(id) : USERS.sel.delete(id); renderUserRows(); renderBulkBar(); }
  if (t.dataset.uselAll !== undefined) { filteredUsers().forEach(u => (t.checked ? USERS.sel.add(u.id) : USERS.sel.delete(u.id))); renderUserRows(); renderBulkBar(); }
  if (t.dataset.urole) patchUser(t.dataset.urole, { role: t.value }, 'Role changed');
  if (t.dataset.uactive) patchUser(t.dataset.uactive, { active: t.checked }, t.checked ? 'User enabled' : 'User disabled and signed out');
  if (t.dataset.reg) {
    const g = USERS.reg; if (!g) return;
    g[t.dataset.reg] = t.type === 'checkbox' ? t.checked : t.value;
    try { USERS.reg = { ...(await req('PUT', '/api/registration', { open: g.open, approval: g.approval, defaultRole: g.defaultRole })), roles: g.roles }; toast('Sign-up rules saved'); }
    catch (err) { toast(err.message); loadSignups(); }
  }
  if (t.dataset.rperm) {
    const card = t.closest('.rolecard'), boxes = [...card.querySelectorAll('[data-rperm]')], get = k => boxes.find(b => b.dataset.rperm === k);
    if (t.dataset.rperm === 'dashboard.edit' && t.checked) get('dashboard.view').checked = true;   // editing needs viewing
    if (t.dataset.rperm === 'dashboard.view' && !t.checked) get('dashboard.edit').checked = false;
    const r = USERS.roles.find(x => x.name === card.dataset.role);
    try { await req('PUT', `/api/roles/${r.name}`, { label: r.label, perms: boxes.filter(b => b.checked).map(b => b.dataset.rperm) }); toast(`${r.label} permissions saved`); }
    catch (err) { toast(err.message); }
    afterUsers();
  }
});
setInterval(pollInbox, 5000);

const MENUS = {
  donut: el => showMenu(el, [
    { label: 'View transactions', icon: 'list', fn: () => go('transactions') },
    { label: 'Export expenses (CSV)', icon: 'download', fn: () => { const t = txs(ui.month).filter(x => x.type === 'expense'); download('expenses.csv', csv([['Date', 'Description', 'Category', 'Amount'], ...t.map(x => [x.date, x.title, catInfo(x).name, x.amount])])); toast('Expenses exported'); } },
  ]),
  trend: el => showMenu(el, [{ label: 'Open reports', icon: 'bars', fn: () => go('reports') }, { label: 'Open insights', icon: 'activity', fn: () => go('insights') }]),
};
document.addEventListener('click', e => {
  if (!e.target.closest('#ctxMenu')) closeMenu();
  if (ui.bellOpen && !e.target.closest('#notif') && !e.target.closest('[data-act=bell]')) { ui.bellOpen = false; renderNotif(); }
  if (ui.pick && !e.target.closest('#rangePop') && !e.target.closest('[data-act=rpick]') && !e.target.closest('[data-act=rprev],[data-act=rnext]')) closePicker();
  if (e.target === $('#modalBg')) return closeModal();
  const menuEl = e.target.closest('[data-menu]');
  if (menuEl) {
    e.stopPropagation();
    const k = menuEl.dataset.menu;
    if (k.startsWith('bud:')) { const c = catById(k.slice(4)); showMenu(menuEl, [{ label: 'Edit budget', icon: 'edit', fn: () => budgetModal(c) }, { label: 'View transactions', icon: 'list', fn: () => go('transactions', { cat: c.id }) }, { label: 'Remove budget', icon: 'trash', danger: true, fn: () => ACT['bud-del']({ dataset: { id: c.id } }) }]); }
    else if (MENUS[k]) MENUS[k](menuEl);
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  // inner controls (edit/delete buttons, checkboxes) must not trigger the row click
  if (el.matches('tr[data-act]') && e.target.closest('[data-stop]')) return;
  if (!CAN.edit && MUT.has(el.dataset.act)) return toast(NO_EDIT);
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el); }
});

/* filters, settings fields, and other inputs */
let searchTimer, nameTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f === 'q') { clearTimeout(searchTimer); searchTimer = setTimeout(() => { ui.tx.q = t.value; ui.tx.page = 1; renderTxBody(); }, 150); }
  if (t.dataset.set === 'threshold') $('#thVal').textContent = t.value;
  if (t.dataset.set === 'name') {
    const v = t.value.trim();
    if (ME) { if (v) { ME.name = v; clearTimeout(nameTimer); nameTimer = setTimeout(() => req('PATCH', '/api/me', { name: v }).catch(err => toast(err.message)), 600); } renderChrome(); }
    else { S.settings.name = v || 'there'; save(); renderChrome(); }
  }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f, s = t.dataset.set;
  if (f === 'rep') { ui.repRange = +t.value; render(); }
  else if (f) { ui.tx[f] = t.value; ui.tx.page = 1; ui.sel.clear(); renderTxBody(); }
  if (s && !CAN.edit && s !== 'name') { toast(NO_EDIT); render(); return; }
  if (s) {
    const val = t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : t.value;
    if (s !== 'name') S.settings[s] = val;
    if (s === 'name' && ME) return;
    save();
    if (['currency', 'theme'].includes(s)) render(); else renderChrome();
  }
  if (t.dataset.rp && ui.pick) { const [y, mo] = ui.pick.view.split('-'); ui.pick.view = t.dataset.rp === 'm' ? `${y}-${pad(+t.value)}` : `${t.value}-${mo}`; renderPicker(); }
  if (t.id === 'imgIn' && t.files[0] && imgTarget) {
    const k = imgTarget;
    resizeImage(t.files[0], k === 'logo' ? 624 : 256, k === 'logo' ? 3 / 4 : undefined)
      .then(u => {
        if (k === 'avatar' && ME) return req('PATCH', '/api/me', { avatar: u }).then(() => { ME.avatar = u; render(); toast('Profile photo updated'); });
        S.settings[k] = u; save(); render(); toast(k === 'logo' ? 'Sidebar image updated' : 'Profile photo updated');
      })
      .catch(err => toast(err.message));
    t.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (V.files.length) {
    if (e.key === 'Escape') { closeViewer(); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { V.i = (V.i + (e.key === 'ArrowRight' ? 1 : -1) + V.files.length) % V.files.length; renderViewer(); return; }
  }
  if (e.key === 'Escape') { if (ui.drawer && !$('#modalBg').classList.contains('open')) closeDrawer(); closeModal(); closeMenu(); if (ui.pick) closePicker(); if (ui.bellOpen) { ui.bellOpen = false; renderNotif(); } } });
window.addEventListener('hashchange', () => { const v = location.hash.replace('#/', ''); if (VIEWS[v] && allowed(v) && v !== ui.view) go(v); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'system') applyTheme(); });

/* =====================================================================
   Boot
   ===================================================================== */
initAI(); $('#aiClearIcon').innerHTML = ic('trash', 18); $('#aiCloseIcon').innerHTML = $('#alCloseIcon').innerHTML = ic('x', 18);
$('#themeSun').innerHTML = ic('sun'); $('#themeMoon').innerHTML = ic('moon'); $('#menuBtn').innerHTML = ic('menu');
$('#bellIcon').innerHTML = ic('bell'); $('#mPrevI').innerHTML = ic('left', 16); $('#mNextI').innerHTML = ic('right', 16);
{ const v = location.hash.replace('#/', ''); if (VIEWS[v]) ui.view = v; }
initStorage().finally(() => { if (!allowed(ui.view)) ui.view = 'overview'; setRange(...presetRange('month')); render(); pollInbox(); });
    </script>
